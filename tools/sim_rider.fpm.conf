; Virtueller Rider (kimmy): php-fpm-Pool für web/api.php gegen tools/sim_rider.py.
; www-data hat kein sudo; XGO_SIM=1 sperrt zusätzlich Herunterfahren, Neustart, WLAN, Emotionen, Einstellungen.
; Installiert von tools/sim_kimmy.sh nach /etc/php/<Version>/fpm/pool.d/xgo-rider.conf.
[xgo-rider]
user = www-data
group = www-data
listen = /run/php/xgo-rider.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
clear_env = yes
env[XGO_NAV] = http://127.0.0.1:8793
env[XGO_PROC] = /srv/xgo_sim/proc
env[XGO_SIM] = 1
