# Virtueller Rider (kimmy): die echte Rider-Weboberfläche gegen tools/sim_rider.py.
# Wie deploy/nginx-xgonav.conf, aber nur HTTP im Heimnetz auf :8791, xgonav des Simulators auf 8793,
# tools/live.php auf 8794, eigener php-fpm-Pool (tools/sim_rider.fpm.conf). Kein Gegensprechen (/sprech).
# Installiert von tools/sim_kimmy.sh nach /etc/nginx/sites-available/xgo-rider.

server {
    listen 8791;
    listen [::]:8791;
    server_name _;
    absolute_redirect off;

    root /srv/xgo_sim/web;

    location = /ws {
        proxy_pass http://127.0.0.1:8793/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /live {
        proxy_pass http://127.0.0.1:8794/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /map.png {
        proxy_pass http://127.0.0.1:8793/map.png;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /startbild.jpg {
        proxy_pass http://127.0.0.1:8793/startbild.jpg;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /frame {
        proxy_pass http://127.0.0.1:8793/frame;
        proxy_buffering off;
        proxy_cache off;
    }

    location /anleitung/ {
        index index.html;
    }

    location = /mcp.php {
        return 404;                 # MCP nur am echten Rider
    }

    location / {
        index index.php;
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_pass unix:/run/php/xgo-rider.sock;
            fastcgi_read_timeout 60s;
        }
    }
}
