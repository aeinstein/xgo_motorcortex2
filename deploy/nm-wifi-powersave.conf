# WLAN-Stromsparen aus (2 = aus). Mit Stromsparen lag der Ping am Rider im Mittel bei 535 ms
# (bis 1,5 s), ohne bei 20 ms (2026-11-18). Im Ruhemodus schaltet deploy/xgo-ruhe es per iw an.
# Nach /etc/NetworkManager/conf.d/xgonav-wifi-powersave.conf (deploy/install-all.sh).
[connection]
wifi.powersave = 2
