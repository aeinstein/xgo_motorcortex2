# xgonav-Weboberfläche, TLS direkt in nginx.
#
#   http://rider/...        -> Weiterleitung auf https://rider/
#   https://rider/          -> PHP-Oberfläche (/opt/xgonav/web, php8.2-fpm)
#   https://rider/xgonav/…  -> intern wie /… (alte Adressen)
#   /ws                     -> xgonav 127.0.0.1:8088/ws (WebSocket, Bilder für die Oberfläche, Bestätigung je Bild)
#   /live                   -> xgonav-live 127.0.0.1:8089 (WebSocket, Laufzeitdaten)
#   /frame                  -> xgonav 127.0.0.1:8088/frame (Einzelbild)
#   /map.png                -> xgonav 127.0.0.1:8088/map.png (Raumkarte)
#   https://rider/mcp.php   -> MCP-Server für ein LLM (web/mcp.php, Freigabe in /etc/xgonav/mcp.json)
#
# Voraussetzungen: xgonav mit [output] web_host = "127.0.0.1", php-fpm-Pool
# deploy/php-fpm-xgonav.conf, Zertifikat und Schlüssel unter /etc/xgonav/tls (Pfade unten;
# deploy/install-all.sh prüft sie). Ersetzt die Default-Site (sites-enabled/default entfernen,
# sonst doppelter default_server auf Port 80). Keine Authentifizierung.
# Installation: nach /etc/nginx/sites-available/xgonav, Link in sites-enabled, nginx -t.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host/;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;
    absolute_redirect off;          # relative Weiterleitungen, Host/Port bleiben wie im Browser

    ssl_certificate     /etc/xgonav/tls/fullchain.crt;
    ssl_certificate_key /etc/xgonav/tls/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:xgonav_tls:1m;
    ssl_session_timeout 1h;

    root /opt/xgonav/web;

    # Alte Adressen /xgonav/... gelten weiter: intern auf /... umgeschrieben (auch WebSockets, ohne Weiterleitung)
    location = /xgonav {
        return 301 /;
    }
    rewrite ^/xgonav/(.*)$ /$1 last;

    # Bilder für die Oberfläche als WebSocket (TLS endet hier, xgonav spricht ws:// lokal)
    location = /ws {
        proxy_pass http://127.0.0.1:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Laufzeitdaten (CPU, WLAN, IMU, Status) als WebSocket vom Dienst xgonav-live (tools/live.php)
    location = /live {
        proxy_pass http://127.0.0.1:8089/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Raumkarte als PNG (Query px/view wird mitgereicht)
    location = /map.png {
        proxy_pass http://127.0.0.1:8088/map.png;
        proxy_buffering off;
        proxy_cache off;
    }

    # Einzelbilder (Query after=<idx> wird mitgereicht)
    location = /frame {
        proxy_pass http://127.0.0.1:8088/frame;
        proxy_buffering off;
        proxy_cache off;
    }

    # Tagebuch: statische Seite, kein PHP, keine Kosten für xgonav
    location /tagebuch/ {
        index index.html;
    }

    # Anleitung: am PC mit MkDocs gebaut (tools/build_manual.sh), statisch, keine Kosten für xgonav
    location /anleitung/ {
        index index.html;
    }

    location / {
        index index.php;
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_pass unix:/run/php/xgonav.sock;        # eigener Pool: deploy/php-fpm-xgonav.conf
            fastcgi_read_timeout 150s;                     # mcp.php: Rundblick/Aufstehen dauern bis ~1 min
        }
    }
}
