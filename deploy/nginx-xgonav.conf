# xgonav-Weboberfläche, TLS direkt in nginx (früher stunnel davor; die alte
# Fernsteuerung rc_server auf 1081 ist abgelöst, ihre Funktionen stecken in /xgonav/).
#
#   http://rider/...        -> Weiterleitung auf https://rider/xgonav/
#   https://rider/          -> Weiterleitung auf /xgonav/
#   https://rider/xgonav/   -> PHP-Oberfläche (/opt/xgonav/web, php8.2-fpm)
#   .../xgonav/ws           -> xgonav 127.0.0.1:8088/ws (WebSocket, Bilder für die Oberfläche, Bestätigung je Bild)
#   .../xgonav/frame        -> xgonav 127.0.0.1:8088/frame (Einzelbild)
#   .../xgonav/map.png      -> xgonav 127.0.0.1:8088/map.png (Raumkarte)
#   .../xgonav/stream       -> xgonav 127.0.0.1:8088/stream (MJPEG, ungepuffert; staut sich bei schwachem WLAN)
#
# Voraussetzungen: xgonav mit [output] web_host = "127.0.0.1", php-fpm-Pool
# deploy/php-fpm-xgonav.conf, Zertifikat und Schlüssel unter rc_server/riderpi (Pfade unten;
# deploy/install-all.sh prüft sie). Ersetzt die Default-Site (sites-enabled/default entfernen,
# sonst doppelter default_server auf Port 80). Keine Authentifizierung.
# Installation: nach /etc/nginx/sites-available/xgonav, Link in sites-enabled, nginx -t.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host/xgonav/;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;
    absolute_redirect off;          # relative Weiterleitungen, Host/Port bleiben wie im Browser

    ssl_certificate     /home/aeinstein/motorcortex/rc_server/riderpi/fullchain.crt;
    ssl_certificate_key /home/aeinstein/motorcortex/rc_server/riderpi/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:xgonav_tls:1m;
    ssl_session_timeout 1h;

    location = /xgonav {
        return 301 /xgonav/;
    }

    # Bilder für die Oberfläche als WebSocket (TLS endet hier, xgonav spricht ws:// lokal)
    location = /xgonav/ws {
        proxy_pass http://127.0.0.1:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Raumkarte als PNG (Query px/view wird mitgereicht)
    location = /xgonav/map.png {
        proxy_pass http://127.0.0.1:8088/map.png;
        proxy_buffering off;
        proxy_cache off;
    }

    # Einzelbilder (Query after=<idx> wird mitgereicht)
    location = /xgonav/frame {
        proxy_pass http://127.0.0.1:8088/frame;
        proxy_buffering off;
        proxy_cache off;
    }

    # Live-Bild direkt von xgonav; PHP-FPM ist für Dauerstreams ungeeignet
    location = /xgonav/stream {
        proxy_pass http://127.0.0.1:8088/stream;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /xgonav/ {
        alias /opt/xgonav/web/;
        index index.php;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_pass unix:/run/php/xgonav.sock;        # eigener Pool: deploy/php-fpm-xgonav.conf
        }
    }

    location = / {
        return 302 /xgonav/;
    }

    location / {
        return 404;
    }
}
