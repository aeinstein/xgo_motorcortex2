# xgonav + Fernsteuerung (rc_server) hinter stunnel.
#
#   https://rider/          -> stunnel :443 -> nginx 127.0.0.1:1080 -> rc_server 127.0.0.1:1081
#   https://rider/xgonav/   -> PHP-Oberfläche (/opt/xgonav/web, php8.2-fpm)
#   .../xgonav/stream       -> xgonav 127.0.0.1:8088/stream (MJPEG, ungepuffert)
#
# Voraussetzungen: rc_server auf Port 1081 (remote_control.js: const port = 1081),
# xgonav mit [output] web_host = "127.0.0.1", php-fpm-Pool deploy/php-fpm-xgonav.conf.
# Keine Authentifizierung.
# Installation: nach /etc/nginx/sites-available/xgonav, Link in sites-enabled, nginx -t.

map $http_upgrade $xgonav_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:1080;
    server_name _;
    absolute_redirect off;          # hinter stunnel: relative Weiterleitungen (sonst http://...:1080)

    location = /xgonav {
        return 301 /xgonav/;
    }

    # Live-Bild direkt von xgonav; PHP-FPM ist für Dauerstreams ungeeignet
    location = /xgonav/stream {
        proxy_pass http://127.0.0.1:8088/stream;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /xgonav/ {
        alias /opt/xgonav/web/;
        index index.php;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_pass unix:/run/php/xgonav.sock;        # eigener Pool: deploy/php-fpm-xgonav.conf
        }
    }

    # optional: alte Fernsteuerung (rc_server, Node, nicht in diesem Repo), inkl. WebSocket
    location / {
        proxy_pass http://127.0.0.1:1081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $xgonav_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
