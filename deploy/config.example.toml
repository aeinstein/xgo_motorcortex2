# xgonav – Overrides der Defaults aus xgonav/config.py
# Nur eintragen, was abweichen soll.
#
# Werte für den XGO RiderPi (CM4, OV5647 mit Weitwinkelobjektiv), gemessen und
# getestet an EINEM Gerät am 2026-11-01/02 (Folgefahrten bei Tageslicht und
# Abendlicht auf Laminat). Mit [K] markierte Werte sind gerätespezifisch und sollten
# neu kalibriert werden (README, Abschnitt „Kalibrieren“).

control_hz = 20.0

[robot]
max_v = 0.15          # Sollwert vor den Faktoren unten; gesendet 0,12 -> 26 cm/s, 0,24 -> 50 cm/s (2026-11-05)
max_w = 0.30          # ~108 °/s; Nutzer 2026-11-05: Drehen x2 (vorher 0.15)
manual_forward_gain = 2.0   # Nutzer 2026-11-05: Handsteuerung vorwärts wie rückwärts; v=0,12 -> 49 cm/s gefahren, v=0,15 -> u8 166 noch nicht
level_after_standup = true   # Nutzer 2026-11-05: einmal nach jedem Aufstehen nivellieren (Totzone der Beine)
vx_limit = 1.8           # gemessen 2026-11-05: Befehl 0,15 -> ~27 cm/s (Bahnprüfung rechnet damit)
reverse_gain = 2.0    # [K] v=-0,15 -> u8 90 (Fahrtest 2026-11-02); seit den Patches vom 2026-11-05 ist die Firmware symmetrisch
kernel_watchdog_ms = 1000

[camera]
source = "picam"
width = 640
height = 480
fps = 24               # fest; max. Belichtung damit 41,7 ms
sensor_mode = "1296x972"  # reines 2x2-Binning, richtige Zeitbasis (640x480-Modus lief ~6 % zu schnell)
scaler_crop = [16, 0, 2560, 1920]   # Ausschnitt wie im 640x480-Modus: hfov/tilt/shading bleiben gültig
hfov_deg = 91.8       # [K] aus Drehungen gegen IMU-Kurs (2026-11-07, f 310 px); Zollstock (88,5) legt nur f·h fest
# 4 ms war bei Wohnraum-Licht (15–50 Lux) fast schwarz. 15 ms reichte bei Tages- und
# Lampenlicht, kostet aber Schärfe bei schnellen Drehungen. 0 = Auto (Modus "short").
exposure_us = 20000      # Standard (Nutzer 2026-11-03): 20 ms bei Verstärkung 16
analogue_gain = 16.0     # OV5647 1..63,9; Automatik nur bis 8; über ~8x kein besserer Rauschabstand
mount_offset_mm = 43.0   # nur ohne cam_h_u8: Kamerahöhe = Körperhöhe + Offset
cam_h_u8 = [100.8, 0.1037]   # [K] Kamerahöhe = a + b·u8; gemessen [109.4, 0.1126] (u8 106/150/200 -> 122/125/132,5 mm),
                             # x0,921 aus Bodenprobe 0,48/0,98 m (2026-11-07): f·h war 7,9 % zu groß, Ursache offen
cam_fwd_mm = 36.0        # [K] Linse vor der Radachse (CAD 36,9; Bodenprobe 34/41); Kartenursprung = Radachse
tilt_deg = 5.18          # [K] Zollstock 2026-11-04, gilt zusammen mit imu.pitch_ref_deg

[imu]
# braucht Treiber-Patch 0002 (/proc/XGORider/imu_log)
enabled = true
imu_hz = 50
pitch_ref_deg = -4.43    # [K] IMU-Rohnick bei der Zollstock-Messung (angelehnt, ruhig)
                         # R-1.1.6: visuell an der Horizontlinie nachgestellt (2026-11-03);
                         # unter R-1.1.3 waren es -2,7 (Wandmessung). Wandmessung für R-1.1.6 offen.
# Vorzeichen und Zeitversatz werden automatisch aus dem Bild bestimmt (RiderPi: -1, +4..+8 ms).
# Optional fest eintragen:
# pitch_sign = -1
# time_offset_ms = 8

[detector]
model = "models/yolo11n_256_ncnn"        # NCNN: CM4 96 ms statt 117 ms (onnxruntime), gleiche Boxen
fallback_model = "models/yolo11n_256.onnx"  # falls NCNN-Modell oder Paket ncnn fehlt
threads = 2            # 2 lassen der Hauptschleife genug Kerne (CM4 gemessen)
max_hz = 5.0           # Detektion höchstens 5x/s (ohne Pause ~7 Hz, ~2 Kerne); spart ~60 % CPU
conf = 0.35
# Personen plus Möbel am Boden: deren Boxen (Unterkante = Fußpunkt) blockieren die Spalten.
# Dünne Stuhl- und Tischbeine sieht das Kantenverfahren nicht (1–2 Spalten), yolo11n_256 findet
# Stühle in den Aufnahmen zuverlässig. Keine Klassen, die nicht am Boden stehen (tv).
# Leer = alle COCO-Klassen.
classes = ["person", "chair", "couch", "dining table", "potted plant", "bed", "dog", "cat"]

[freespace]
method = "kanten"        # Bodengrenze aus Stufenkanten; replay 2026-11-04: Fehlalarme 0,2–16 % statt 25–53 % (Farbe)
# edge_log_s = 16 und edge_glare = true sind Standard (2026-11-05): dunkle Wände/Möbel werden
# erkannt, Lampenschein auf glänzendem Boden gilt als unbekannt statt als Hindernis.
threaded = true          # Bodenmodell in eigenem Thread: Schleife p95 27 -> 17 ms (CM4, 2026-11-02)
# [K] Linsenabschattung: tools/calibrate.py shading erzeugt shading.json. Fehlt die
# Datei, läuft xgonav ohne Korrektur (Warnung im Log) – dann hält das Bodenmodell am
# RiderPi die Bildränder für Hindernisse und die Bahnprüfung blockiert.
shading_file = "shading.json"
shading_max_gain = 5.0   # Nahbereich mit verrauschtem Rot gilt als unbekannt statt Hindernis
sample_rows = 0.34       # Bodenprobe vom unteren Rand bis ~0,6 m (naher und ferner Boden)
sample_cols = 0.5

[grid]
file = "/opt/xgonav/raumkarte.npz"   # Raumkarte speichern/laden; beim Laden muss der Rider am Startpunkt stehen
yaw_source = "imu"       # 2026-11-06: Räder rutschen beim Drehen (75 cm nach 32 m), IMU ~6 cm
free_range_m = 1.1       # 2026-11-06: Stufe wurde aus > 1 m als Boden gesehen und bei 1,5 m als frei eingetragen

[map]
confirm = 3              # Kartenpunkt blockiert die Bahn erst nach 3 Beobachtungen

[behavior]
mode = "idle"         # idle | follow | explore | approach | home
target_class = "person"
follow_dist_m = 0.9
dist_deadband = 0.10
approach_dist_m = 0.5
cruise_v = 0.15
search_w = 0.07          # langsam suchen; kleinere Werte ignoriert die Firmware
turn_w = 0.21            # Erkunden: Wegdrehen (vorher 1,5 x search_w = 0,105; x2 am 2026-11-05)
search_timeout_s = 10.0
height_fast_mm = 80.0    # Abstand zu den Höhengrenzen (nie ganz nach unten)
height_search_mm = 100.0

[output]
web_host = "127.0.0.1"  # nur lokal; Oberfläche: PHP über nginx (deploy/nginx-xgonav.conf)
web_port = 8088
lcd_fifo = "/tmp/lcd0"
lcd_fps = 15

[emotion]               # automatisch aufs Display (xgonav/emotion.py), nur am Rider
enabled = true          # surprised: Person erscheint; doubt/embarrassed: keine Person (follow/sonst); shy: Akku
gap_s = 5.0             # surprised erst nach so langer Pause ohne Person
lost_s = 2.0            # doubt bzw. embarrassed nach so langer Zeit ohne Person
battery_low = 20        # %, Treiber schaltet bei 8 % ab

[cpu]
# CPU-Pinning (CM4, 4 Kerne), gemessen 2026-11-02: CPU 282 -> 249 %, Detektor 149 -> 129 ms,
# Schleife p95 38 -> 35 ms; mit Bild-Client 286 -> 263 %, p95 39 -> 36 ms.
main_cpus = [0, 1]          # Hauptschleife, Kamera, OpenCV-Worker, Rest des Systems
detector_cpus = [2, 3]      # YOLO: NCNN-Thread + OpenMP auf 2-3 (onnxruntime: Aufrufer 2, Pool 3)
render_cpus = [0, 1, 2, 3]  # Bilder für die Oberfläche: alle Kerne (auf 2-3 ist neben YOLO Luft)
freespace_cpus = [2, 3]     # Bodenmodell-Thread: neben YOLO ist dort Luft

[odom]
# Rad-Odometrie (Firmware R-1.1.6+Patch). 60 mm / 1024 Ticks am Maßband bestätigt (29,5 cm).
# Faktoren aus tools/calibrate_odom.py (2026-11-04, nach ESP-Neustart): 212,5 cm am Maßband,
# Räder roh 210,95 / 210,68 cm, Fahrt sichtbar geradeaus (Kurs = 0). Der Kamera-Kurs zeigte dabei
# −8,9° und taugt nicht als Referenz. Früher 0,9905/1,0068: Reifen saß falsch.
scale_left = 1.0073
scale_right = 1.0087
