# xgonav – Overrides der Defaults aus xgonav/config.py
# Nur eintragen, was abweichen soll.
#
# Werte für den XGO RiderPi (CM4, OV5647 mit Weitwinkelobjektiv), gemessen und
# getestet an EINEM Gerät am 2026-11-01/02 (Folgefahrten bei Tageslicht und
# Abendlicht auf Laminat). Mit [K] markierte Werte sind gerätespezifisch und sollten
# neu kalibriert werden (README, Abschnitt „Kalibrieren“).

control_hz = 24.0       # jedes Bild (camera.fps)

[robot]
# Seit 2026-11-23 sind alle Fahr- und Drehwerte der Modi und die Handsteuerung Anteile davon (gesendet Faktor x tempo x max_v)
max_v = 0.5           # Nutzer 2026-11-13: 50 % (vorher 0.15); gesendet 0,12 -> 26 cm/s, 0,24 -> 50 cm/s, darüber nie gefahren
max_w = 0.5           # ~180 °/s; Nutzer 2026-11-13: 50 % (vorher 0.30)
level_after_standup = true   # Nutzer 2026-11-05: einmal nach jedem Aufstehen nivellieren (Totzone der Beine)
vx_limit = 1.8           # gemessen 2026-11-05: Befehl 0,15 -> ~27 cm/s (Bahnprüfung rechnet damit)
kernel_watchdog_ms = 1000
speed_ctrl = true     # Nutzer 2026-11-12: auf Teppich langsamer als auf glattem Boden -> auf die Räder regeln; nicht gefahren

[camera]
source = "picam"
width = 640
height = 480
fps = 24               # fest; max. Belichtung damit 41,7 ms
sensor_mode = "1296x972"  # reines 2x2-Binning, richtige Zeitbasis (640x480-Modus lief ~6 % zu schnell)
scaler_crop = [16, 0, 2560, 1920]   # Ausschnitt wie im 640x480-Modus: hfov/tilt bleiben gültig
hfov_deg = 91.8       # [K] aus Drehungen gegen IMU-Kurs (2026-11-07, f 310 px); Zollstock (88,5) legt nur f·h fest
# 4 ms war bei Wohnraum-Licht (15–50 Lux) fast schwarz. 15 ms reichte bei Tages- und
# Lampenlicht, kostet aber Schärfe bei schnellen Drehungen. 0 = Auto (Modus "short").
exposure_us = 20000      # Standard (Nutzer 2026-11-03): 20 ms bei Verstärkung 16
analogue_gain = 16.0     # OV5647 1..63,9; Automatik nur bis 8; über ~8x kein besserer Rauschabstand
mount_offset_mm = 43.0   # nur ohne cam_h_u8: Kamerahöhe = Körperhöhe + Offset
cam_h_u8 = [109.4, 0.1126]   # [K] Kamerahöhe = a + b·u8; gemessen u8 106/150/200 -> 122/125/132,5 mm; Gitter am Boden
                             # 2026-11-10 bestätigt (u8 128: 124-126, u8 205: 131-133 mm); ohne Zusatzfaktor
cam_fwd_mm = 36.0        # [K] Linse vor der Radachse (CAD 36,9; Bodenprobe 34/41); Kartenursprung = Radachse
tilt_deg = 5.18          # [K] Zollstock 2026-11-04, gilt zusammen mit imu.pitch_ref_deg

[imu]
# braucht Treiber-Patch 0002 (/proc/XGORider/imu_log)
enabled = true
imu_hz = 50
stream_hz = 100          # Firmware 0014 + Treiber: IMU/Rad-Strom mit Messzeit der Firmware (2026-11-08); Abfrage nur als Rückfall
pitch_ref_deg = -5.0     # [K] IMU-Rohnick bei der Zollstock-Messung (-4.43), +0,2° aus der Flurbreite 2,04 m (2026-11-17), -2° für Firmware 0021 (2026-11-18), +1,23° aus der Flurfahrt 2026-11-19 (2,04 m)
                         # R-1.1.6: visuell an der Horizontlinie nachgestellt (2026-11-03);
                         # unter R-1.1.3 waren es -2,7 (Wandmessung). Wandmessung für R-1.1.6 offen.
# [K] pitch_sign = -1 und time_offset_ms = 10.5 sind Default (tools/imu_versatz.py auf einer Rohaufnahme, 2026-11-17).
# Anderes Gerät: mit imu_versatz.py neu messen und hier eintragen.

[detector]
model = "models/yolo11n_256_ncnn"        # NCNN: CM4 96 ms statt 117 ms (onnxruntime), gleiche Boxen
fallback_model = "models/yolo11n_256.onnx"  # falls NCNN-Modell oder Paket ncnn fehlt
threads = 2            # 2 lassen der Hauptschleife genug Kerne (CM4 gemessen)
max_hz = 5.0           # Detektion höchstens 5x/s (ohne Pause ~7 Hz, ~2 Kerne); spart ~60 % CPU
conf = 0.35
# Wählbare Ziele für follow/approach (Auswahl im Web). Nur Erkennung: Boxen sind nie Hindernisse,
# das entscheidet allein das Bodenmodell. Der Detektor läuft nur in follow, approach und pet.
# Leer = alle COCO-Klassen.
classes = ["person", "chair", "couch", "dining table", "potted plant", "bed", "dog", "cat"]

[freespace]
# Bodengrenze nur aus FloorNet (net = "models/floornet.bin" ist Standard). Ohne Netz ist der Rider blind und fährt
# nicht selbst; das klassische Bodenmodell (kanten, farbe, Linsenabschattung) gibt es seit 2026-11-18 nicht mehr.
# net_outlier_px = 25.0 ist Standard: einzelne Zacken der Grenze herausnehmen (0 = aus), docs/floornet.md
# net_smooth_n = 3      # Kante über 3 Netzbilder beruhigen (Median je Spalte nach Umrechnen mit Pose und Nicken),
                        # 0 = aus; 3 ist Default, docs/floornet.md
threaded = true          # Netz in eigenem Thread

[grid]
file = "/opt/xgonav/raumkarte.npz"   # Raumkarte speichern/laden; beim Laden muss der Rider am Startpunkt stehen
# free_range_m = 1.5 ist Standard (2026-11-14): offener Boden so weit wie Treffer
# free_range_m = 1.1     # 2026-11-06: Stufe wurde aus > 1 m als Boden gesehen und bei 1,5 m als frei eingetragen
# max_range_m = 1.5 und confirm_dr_m = 0 sind Standard (2026-11-14): Treffer bis 1,5 m (entlang des Strahls), eine Sichtung genügt (FloorNet).
# confirm_dr_m = 0.2     # Treffer erst aus zwei Abständen (2026-11-08 gegen das Spiegelbild der Fensterunterkante)

[map]
confirm = 3              # Kartenpunkt blockiert die Bahn erst nach 3 Beobachtungen

[behavior]
mode = "idle"         # idle | follow | explore | approach | home
target_class = "person"
follow_dist_m = 0.9
dist_deadband = 0.10
approach_dist_m = 0.5
cruise_v = 0.30          # Anteil von max_v (absolut 0,15)
search_w = 0.14          # Anteil von max_w (absolut 0,07); langsam suchen
turn_w = 0.42            # Anteil von max_w (absolut 0,21); Erkunden: Wegdrehen
search_timeout_s = 10.0
height_fast_mm = 80.0    # Abstand zu den Höhengrenzen (nie ganz nach unten)
height_search_mm = 100.0

[output]
web_host = "127.0.0.1"  # nur lokal; Oberfläche: PHP über nginx (deploy/nginx-xgonav.conf)
web_port = 8088
lcd_fifo = "/tmp/lcd0"
lcd_fps = 15

[emotion]               # automatisch aufs Display (xgonav/emotion.py), nur am Rider
enabled = true          # surprised: Person erscheint; doubt/embarrassed: keine Person (follow/sonst); shy: Akku
gap_s = 5.0             # surprised erst nach so langer Pause ohne Person
lost_s = 2.0            # doubt bzw. embarrassed nach so langer Zeit ohne Person
battery_low = 20        # %, Treiber schaltet bei 8 % ab

[pet]                   # Modus pet (xgonav/pet.py); Boden und Karte können dafür aus bleiben, wenn creep_m = seek_m = roam_m = 0
# Standard: bleibt auf der Stelle, keine Ohnmacht. Einzeln und unter Beobachtung freischalten,
# nie oben an der Treppe. Rückwärts ist blind, beim Aufspringen rollt er ~20 cm vor.
# retreat_m = 0.12      # Ruck zurück beim Schreck
# creep_m = 0.4         # zur Katze schleichen; braucht Bodenmodell und Merkkarte
# faint = false         # heftiger Schreck: absetzen, 10 s, von selbst aufstehen (Standard an)
# Suchen/Streifen fahren am RiderPi ohne Grenze (seek_m = roam_m = roam_radius_m = -1); 0 = aus, sonst Meter
# seek_m = 0            # Person weg: nicht zur letzten Stelle fahren, nur umschauen
# roam_m = 0            # niemand da: nicht streifen, nur umschauen
# look = false          # auch nicht mehr umschauen (dreht sonst auf der Stelle)

[cpu]
# CPU-Pinning (CM4, 4 Kerne), gemessen 2026-11-02: CPU 282 -> 249 %, Detektor 149 -> 129 ms,
# Schleife p95 38 -> 35 ms; mit Bild-Client 286 -> 263 %, p95 39 -> 36 ms.
main_cpus = [0, 1]          # Hauptschleife, Kamera, OpenCV-Worker, Rest des Systems
detector_cpus = [2, 3]      # YOLO: NCNN-Thread + OpenMP auf 2-3 (onnxruntime: Aufrufer 2, Pool 3)
render_cpus = [0, 1, 2, 3]  # Bilder für die Oberfläche: alle Kerne (auf 2-3 ist neben YOLO Luft)
freespace_cpus = [2, 3]     # Bodenmodell-Thread: neben YOLO ist dort Luft

[odom]
# Rad-Odometrie (Firmware R-1.1.6+Patch). 60 mm / 1024 Ticks am Maßband bestätigt (29,5 cm).
# Faktoren aus tools/calibrate_odom.py (2026-11-04, nach ESP-Neustart): 212,5 cm am Maßband,
# Räder roh 210,95 / 210,68 cm, Fahrt sichtbar geradeaus (Kurs = 0). Der Kamera-Kurs zeigte dabei
# −8,9° und taugt nicht als Referenz. Früher 0,9905/1,0068: Reifen saß falsch.
scale_left = 1.0080     # 2026-11-19 beide gleich: Räder gegen IMU-Kurs in 66 Rohfahrten ohne Unterschied (Maßband 2026-11-04: 1,0073/1,0087)
scale_right = 1.0080

[reloc]
# enabled = true         # Pose in der Raumkarte gilt nach Absetzen, Sturz und Neustart als unbekannt: Die Karte wird
                         # dann nicht beschrieben, home/patrol/explore starten nicht, bis der Standort im Web
                         # bestätigt ist ("Steht am Startpunkt" oder "Pose stimmt"). Am RiderPi noch nicht gesetzt.
