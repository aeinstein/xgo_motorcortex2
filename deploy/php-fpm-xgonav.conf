; php-fpm-Pool für die xgonav-Oberfläche (web/).
; Nach /etc/php/8.2/fpm/pool.d/xgonav.conf; nginx (deploy/nginx-xgonav.conf) nutzt den Socket.
; listen.owner/group = Benutzer, unter dem nginx läuft (RiderPi: aeinstein, siehe nginx.conf "user").
[xgonav]
user = www-data
group = www-data
listen = /run/php/xgonav.sock
listen.owner = aeinstein
listen.group = aeinstein
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
